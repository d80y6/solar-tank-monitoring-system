name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run project checks
        run: pnpm check

  mysql-integration:
    name: MySQL integration tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: solar_tank_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # The database variables are set per step on purpose. Exporting them for the
    # whole job makes the memory-storage unit tests exercise the MySQL path
    # instead, which looks like a test failure but is really environment bleed.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply every migration and the demo seed
        env:
          MYSQL_DATABASE_URL: mysql://root@127.0.0.1:3306/solar_tank_ci
          MYSQL_SSL_MODE: disabled
        run: pnpm db:setup:mysql

      - name: Verify the migration ledger
        env:
          MYSQL_DATABASE_URL: mysql://root@127.0.0.1:3306/solar_tank_ci
          MYSQL_SSL_MODE: disabled
        run: pnpm db:migrations:check

      - name: Run the full test suite
        run: >-
          pnpm exec vitest run
          --passWithNoTests
          --reporter=default
          --reporter=json
          --outputFile=/tmp/vitest-report-full.json

      - name: Run the MySQL integration suite
        env:
          MYSQL_DATABASE_URL: mysql://root@127.0.0.1:3306/solar_tank_ci
          MYSQL_INTEGRATION_URL: mysql://root@127.0.0.1:3306/solar_tank_ci
          MYSQL_SSL_MODE: disabled
          RUN_MYSQL_INTEGRATION_TESTS: "1"
          SOLAR_TANK_STORAGE_DRIVER: mysql
        run: >-
          pnpm exec vitest run
          src/features/monitoring/tests/mysql-integration.test.ts
          --reporter=default
          --reporter=json
          --outputFile=/tmp/vitest-report.json

      # The JSON report lets the next step publish each failing test as an
      # annotation, which is far easier to read than the full job log.
      - name: Annotate failing tests
        if: failure()
        run: |
          node scripts/report-vitest-failures.mjs /tmp/vitest-report.json
          node scripts/report-vitest-failures.mjs /tmp/vitest-report-full.json

      - name: Print the database state on failure
        if: failure()
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=root solar_tank_ci \
            --execute="SELECT id FROM schema_migrations ORDER BY id" || true
          mysql --host=127.0.0.1 --port=3306 --user=root solar_tank_ci \
            --execute="SHOW TABLES" || true
